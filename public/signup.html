<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Hub - Access Restricted</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="auth.css">
    <style>
        .blocked-icon {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, #f87171, #ef4444);
            border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 1rem;
            box-shadow: 0 8px 24px rgba(239,68,68,0.3);
        }
        .blocked-icon svg { stroke: white; }
        .blocked-title { font-size: 1.4rem; font-weight: 700; color: #1e293b; margin-bottom: 0.4rem; }
        .blocked-sub { font-size: 0.9rem; color: #64748b; line-height: 1.6; margin-bottom: 1.5rem; }
        .countdown { font-size: 0.8rem; color: #94a3b8; margin-top: 1rem; }
        .redirect-bar {
            height: 4px; background: #f1f5f9; border-radius: 4px; overflow: hidden; margin-top: 1.25rem;
        }
        .redirect-fill {
            height: 100%; background: linear-gradient(90deg, #6366f1, #818cf8);
            border-radius: 4px;
            animation: fillBar 4s linear forwards;
        }
        @keyframes fillBar { from { width: 0%; } to { width: 100%; } }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card" style="text-align:center; padding: 2.5rem;">
            <div class="blocked-icon">
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
            </div>
            <div class="blocked-title">Access Restricted</div>
            <div class="blocked-sub">
                User accounts for <strong>Business Hub</strong> are created by Admin only.<br>
                Self-registration is not permitted.<br><br>
                Please contact your administrator to get your login credentials.
            </div>
            <a href="/login.html" class="auth-btn" style="display:inline-block; text-decoration:none; padding: 0.75rem 2rem; border-radius: 12px; background: linear-gradient(135deg, #6366f1, #818cf8); color: white; font-weight: 600;">
                ← Back to Login
            </a>
            <div class="redirect-bar"><div class="redirect-fill"></div></div>
            <div class="countdown" id="countdown">Redirecting to login in 4 seconds…</div>
        </div>
    </div>
    <script>
        // Auto-redirect after 4 seconds
        let secs = 4;
        const cd = document.getElementById('countdown');
        const t = setInterval(() => {
            secs--;
            cd.textContent = `Redirecting to login in ${secs} second${secs !== 1 ? 's' : ''}…`;
            if (secs <= 0) { clearInterval(t); window.location.href = '/login.html'; }
        }, 1000);
    </script>
</body>
</html>
